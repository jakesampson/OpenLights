{
  "productName": "OpenLights",
  "directories": {
    "output": "release",
    "buildResources": "build"
  },
  "icon": "assets/branding/openlights-icon.png",
  "mac": {
    "target": "dmg",
    "icon": "assets/branding/openlights-icon.icns",
    "identity": null,
    "gatekeeperAssess": false,
    "hardenedRuntime": true,
    "entitlements": "build/entitlements.mac.plist",
    "entitlementsInherit": "build/entitlements.mac.plist",
    "extendInfo": {
      "NSHighResolutionCapable": true,
      "NSMicrophoneUsageDescription": "Used for audio beat detection.",
      "com.apple.security.device.audio": true,
      "com.apple.security.serial": true,
      "com.apple.security.hid": true
    }
  },
  "win": {
    "target": "nsis",
    "icon": "assets/branding/openlights-icon.ico",
    "requestedExecutionLevel": "asInvoker"
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true,
    "createDesktopShortcut": true,
    "createStartMenuShortcut": true
  },
  "publish": {
    "provider": "github",
    "owner": "jakesampson",
    "repo": "OpenLights",
    "publishAutoUpdate": true
  },
  "asar": true,
  # NDI Ambience: grandi's native binding (grandi.node) and the bundled
  # NDI runtime (libndi) cannot load from inside the asar — they must
  # live unpacked beside it, as the serialport binding already does.
  "asarUnpack": [
    "**/node_modules/@grandi/**"
  ],
  "compression": "normal",
  "artifactName": "${productName}-${version}-${os}-${arch}.${ext}",
  "files": [
    "**/*",
    "!fixtures-github/**",
    "!tests/**"
  ]
}
